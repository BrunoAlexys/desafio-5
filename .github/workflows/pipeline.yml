name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast:
    name: 1. SAST (Static Application Security Testing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Run njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: '.'

  build:
    name: 2. Build Application
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install

  lint:
    name: 3. Lint & Code Quality
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Lint
        run: npm run lint

  test:
    name: 4. Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Tests
        run: npm run test

  docker:
    name: 5. Build & Push to DockerHub
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/desafio-5:latest

  terraform:
    name: 6. Deploy Infra Terraform
    runs-on: ubuntu-latest
    needs: docker
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
          - 4510-4559:4510-4559
        env:
          SERVICES: ec2
          DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        
      - name: Terraform Init
        run: terraform init
        
      - name: Terraform Apply
        run: terraform apply -auto-approve
